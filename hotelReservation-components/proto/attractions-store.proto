syntax = "proto3";
package attractions_store;

service AttractionsStore {
    rpc LoadHotelPositions(LoadRequest)         returns (LoadHotelPositionsResponse);
    rpc LoadRestaurants(LoadRequest)            returns (LoadRestaurantsResponse);
    rpc LoadMuseums(LoadRequest)                returns (LoadMuseumsResponse);
    rpc LoadCinemas(LoadRequest)                returns (LoadCinemasResponse);
    rpc GetHotelPosition(GetHotelPositionRequest) returns (GetHotelPositionResponse);
}

message HotelPosition {
    string id  = 1;
    double lat = 2;
    double lon = 3;
}

message Restaurant {
    string id       = 1;
    double lat      = 2;
    double lon      = 3;
    string name     = 4;
    float  rating   = 5;
    string category = 6;
}

message Museum {
    string id       = 1;
    double lat      = 2;
    double lon      = 3;
    string name     = 4;
    string category = 5;
}

message Cinema {
    string id       = 1;
    double lat      = 2;
    double lon      = 3;
    string name     = 4;
    string category = 5;
}

message LoadRequest {}
message GetHotelPositionRequest    { string hotel_id = 1; }
message GetHotelPositionResponse   { HotelPosition hotel = 1; bool found = 2; }
message LoadHotelPositionsResponse { repeated HotelPosition hotels      = 1; }
message LoadRestaurantsResponse    { repeated Restaurant     restaurants = 1; }
message LoadMuseumsResponse        { repeated Museum         museums     = 1; }
message LoadCinemasResponse        { repeated Cinema         cinemas     = 1; }
