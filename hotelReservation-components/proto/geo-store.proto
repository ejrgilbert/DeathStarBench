syntax = "proto3";
package geo_store;

service GeoStore {
    rpc Init(InitRequest)                       returns (InitResponse);
    rpc LoadGeo(LoadRequest)                    returns (LoadGeoResponse);
}

message Point {
    string id  = 1;
    double lat = 2;
    double lon = 3;
}

message InitRequest {}
message InitResponse {}
message LoadRequest {}
message LoadGeoResponse { repeated Point geo = 1; }
