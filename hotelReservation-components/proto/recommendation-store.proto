syntax = "proto3";
package recommendation_store;

service RecommendationStore {
    rpc LoadHotels(LoadHotelsRequest) returns (LoadHotelsResponse);
}

message Hotel {
    string id    = 1;
    double lat   = 2;
    double lon   = 3;
    double rate  = 4;
    double price = 5;
}

message LoadHotelsRequest {}
message LoadHotelsResponse { repeated Hotel hotels = 1; }
