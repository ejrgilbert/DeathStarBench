[package]
name = "host-lib"
version = "0.1.0"
edition = "2021"

[dependencies]
wasmtime      = { version = "29", features = ["component-model", "async"] }
wasmtime-wasi = "29"
mongodb       = "3"
bson          = "2"
serde_json    = "1"
tonic         = { version = "0.12", features = ["transport"] }
prost         = "0.13"
tokio         = { version = "1", features = ["full"] }
futures       = "0.3"
anyhow        = "1"

[build-dependencies]
tonic-build = "0.12"
