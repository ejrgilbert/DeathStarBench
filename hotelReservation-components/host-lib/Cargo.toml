[package]
name = "host-lib"
version = "0.1.0"
edition = "2021"

[dependencies]
wasmtime      = { version = "25", features = ["component-model", "async"] }
wasmtime-wasi = "25"
mongodb       = "3"
bson          = "2"
serde_json    = "1"
futures       = "0.3"
tokio         = { version = "1", features = ["full"] }
tonic         = { version = "0.12", features = ["transport"] }
anyhow        = "1"
