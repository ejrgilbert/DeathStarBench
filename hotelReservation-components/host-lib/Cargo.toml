[package]
name = "host-lib"
version = "0.1.0"
edition = "2021"

[dependencies]
wasmtime = { version = "47", default-features = false, features = ["runtime", "std", "cranelift", "component-model", "async", "anyhow", "pooling-allocator"] }

wasmtime-wasi = "47"
mongodb       = "3"
bson          = "2"
serde_json    = "1"
futures       = "0.3"
tokio         = { version = "1", features = ["full"] }
tonic         = { version = "0.12", features = ["transport"] }
prost         = "0.13"
async-channel = "2"
anyhow        = "1"
# equivalence-harness topology capture (EQUIV_TOPOLOGY-gated tower layer)
tower         = "0.4"
http          = "1"

[build-dependencies]
tonic-build = "0.12"
