# Config 2 (TCP): each wasm component runs in its own host process.
# Inter-component calls go over gRPC on the Docker bridge network.
#
# Prerequisite: run `make all` to build *.wasm files before bringing this stack up.

services:
  mongodb-recommendation:
    image: mongo:5.0
    volumes:
      - recommendation-data:/data/db
      - ./data/recommendation-seed.json:/seed/recommendation-seed.json:ro
      - ./data/init/recommendation-init.sh:/docker-entrypoint-initdb.d/init.sh:ro

  recommendation-store:
    build:
      context: .
      target: runtime
      args:
        SERVICE: recommendation
    environment:
      MODE: store
      MONGO_URI: "mongodb://mongodb-recommendation:27017"
      LISTEN_ADDR: "0.0.0.0:8086"
      WASM_FILE: /app/recommendation-store.wasm
      GC_EVERY: "${GC_EVERY:-1}"
    ports:
      - "8086:8086"
    depends_on:
      - mongodb-recommendation
    restart: on-failure

  recommendation:
    build:
      context: .
      target: runtime
      args:
        SERVICE: recommendation
    environment:
      MODE: svc
      STORE_ADDR: "http://recommendation-store:8086"
      LISTEN_ADDR: "0.0.0.0:8085"
      WASM_FILE: /app/recommendation.wasm
      GC_EVERY: "${GC_EVERY:-1}"
    ports:
      - "8085:8085"
    depends_on:
      - recommendation-store
    restart: on-failure

  mongodb-attractions:
    image: mongo:5.0
    volumes:
      - attractions-data:/data/db
      - ./data/attractions-seed.json:/seed/attractions-seed.json:ro
      - ./data/init/attractions-init.sh:/docker-entrypoint-initdb.d/init.sh:ro

  attractions-store:
    build:
      context: .
      target: runtime
      args:
        SERVICE: attractions
    environment:
      MODE: store
      MONGO_URI: "mongodb://mongodb-attractions:27017"
      LISTEN_ADDR: "0.0.0.0:8088"
      WASM_FILE: /app/attractions-store.wasm
      GC_EVERY: "${GC_EVERY:-1}"
    ports:
      - "8088:8088"
    depends_on:
      - mongodb-attractions
    restart: on-failure

  attractions:
    build:
      context: .
      target: runtime
      args:
        SERVICE: attractions
    environment:
      MODE: svc
      STORE_ADDR: "http://attractions-store:8088"
      LISTEN_ADDR: "0.0.0.0:8087"
      WASM_FILE: /app/attractions.wasm
      GC_EVERY: "${GC_EVERY:-1}"
    ports:
      - "8087:8087"
    depends_on:
      - attractions-store
    restart: on-failure

  mongodb-geo:
    image: mongo:5.0
    volumes:
      - geo-data:/data/db
      - ./data/geo-seed.json:/seed/geo-seed.json:ro
      - ./data/init/geo-init.sh:/docker-entrypoint-initdb.d/init.sh:ro

  geo-store:
    build:
      context: .
      target: runtime
      args:
        SERVICE: geo
    environment:
      MODE: store
      MONGO_URI: "mongodb://mongodb-geo:27017"
      LISTEN_ADDR: "0.0.0.0:8090"
      WASM_FILE: /app/geo-store.wasm
      GC_EVERY: "${GC_EVERY:-1}"
    ports:
      - "8090:8090"
    depends_on:
      - mongodb-geo
    restart: on-failure

  geo:
    build:
      context: .
      target: runtime
      args:
        SERVICE: geo
    environment:
      MODE: svc
      STORE_ADDR: "http://geo-store:8090"
      LISTEN_ADDR: "0.0.0.0:8089"
      WASM_FILE: /app/geo.wasm
      GC_EVERY: "${GC_EVERY:-1}"
    ports:
      - "8089:8089"
    depends_on:
      - geo-store
    restart: on-failure

  mongodb-user:
    image: mongo:5.0
    volumes:
      - user-data:/data/db
      - ./data/user-seed.json:/seed/user-seed.json:ro
      - ./data/init/user-init.sh:/docker-entrypoint-initdb.d/init.sh:ro

  user-store:
    build:
      context: .
      target: runtime
      args:
        SERVICE: user
    environment:
      MODE: store
      MONGO_URI: "mongodb://mongodb-user:27017"
      LISTEN_ADDR: "0.0.0.0:8092"
      WASM_FILE: /app/user-store.wasm
      GC_EVERY: "${GC_EVERY:-1}"
    ports:
      - "8092:8092"
    depends_on:
      - mongodb-user
    restart: on-failure

  user:
    build:
      context: .
      target: runtime
      args:
        SERVICE: user
    environment:
      MODE: svc
      STORE_ADDR: "http://user-store:8092"
      LISTEN_ADDR: "0.0.0.0:8091"
      WASM_FILE: /app/user.wasm
      GC_EVERY: "${GC_EVERY:-1}"
    ports:
      - "8091:8091"
    depends_on:
      - user-store
    restart: on-failure

  mongodb-rate:
    image: mongo:5.0
    volumes:
      - rate-data:/data/db
      - ./data/rate-seed.json:/seed/rate-seed.json:ro
      - ./data/init/rate-init.sh:/docker-entrypoint-initdb.d/init.sh:ro

  rate-store:
    build:
      context: .
      target: runtime
      args:
        SERVICE: rate
    environment:
      MODE: store
      MONGO_URI: "mongodb://mongodb-rate:27017"
      LISTEN_ADDR: "0.0.0.0:8094"
      WASM_FILE: /app/rate-store.wasm
      GC_EVERY: "${GC_EVERY:-1}"
    ports:
      - "8094:8094"
    depends_on:
      - mongodb-rate
    restart: on-failure

  # Cache service (Wasm cache component behind gRPC to match Go-native architecture)
  cache-rate:
    build:
      context: .
      target: runtime
      args:
        SERVICE: cache
    environment:
      LISTEN_ADDR: "0.0.0.0:8110"
      WASM_FILE: /app/cache.wasm
      GC_EVERY: "${GC_EVERY:-1}"
    ports:
      - "8110:8110"
    restart: on-failure

  rate:
    build:
      context: .
      target: runtime
      args:
        SERVICE: rate
    environment:
      MODE: svc
      STORE_ADDR: "http://rate-store:8094"
      CACHE_ADDR: "http://cache-rate:8110"
      LISTEN_ADDR: "0.0.0.0:8093"
      WASM_FILE: /app/rate.wasm
      GC_EVERY: "${GC_EVERY:-1}"
    ports:
      - "8093:8093"
    depends_on:
      - rate-store
      - cache-rate
    restart: on-failure

  mongodb-profile:
    image: mongo:5.0
    volumes:
      - profile-data:/data/db
      - ./data/profile-seed.json:/seed/profile-seed.json:ro
      - ./data/init/profile-init.sh:/docker-entrypoint-initdb.d/init.sh:ro

  profile-store:
    build:
      context: .
      target: runtime
      args:
        SERVICE: profile
    environment:
      MODE: store
      MONGO_URI: "mongodb://mongodb-profile:27017"
      LISTEN_ADDR: "0.0.0.0:8096"
      WASM_FILE: /app/profile-store.wasm
      GC_EVERY: "${GC_EVERY:-1}"
    ports:
      - "8096:8096"
    depends_on:
      - mongodb-profile
    restart: on-failure

  cache-profile:
    build:
      context: .
      target: runtime
      args:
        SERVICE: cache
    environment:
      LISTEN_ADDR: "0.0.0.0:8111"
      WASM_FILE: /app/cache.wasm
      GC_EVERY: "${GC_EVERY:-1}"
    ports:
      - "8111:8111"
    restart: on-failure

  profile:
    build:
      context: .
      target: runtime
      args:
        SERVICE: profile
    environment:
      MODE: svc
      STORE_ADDR: "http://profile-store:8096"
      CACHE_ADDR: "http://cache-profile:8111"
      LISTEN_ADDR: "0.0.0.0:8095"
      WASM_FILE: /app/profile.wasm
      GC_EVERY: "${GC_EVERY:-1}"
    ports:
      - "8095:8095"
    depends_on:
      - profile-store
      - cache-profile
    restart: on-failure

  search:
    build:
      context: .
      target: runtime
      args:
        SERVICE: search
    environment:
      GEO_ADDR:    "http://geo:8089"
      RATE_ADDR:   "http://rate:8093"
      LISTEN_ADDR: "0.0.0.0:8097"
      WASM_FILE:   /app/search.wasm
      GC_EVERY: "${GC_EVERY:-1}"
    ports:
      - "8097:8097"
    depends_on:
      - geo
      - rate
    restart: on-failure

  mongodb-review:
    image: mongo:5.0
    volumes:
      - review-data:/data/db
      - ./data/review-seed.json:/seed/review-seed.json:ro
      - ./data/init/review-init.sh:/docker-entrypoint-initdb.d/init.sh:ro

  review-store:
    build:
      context: .
      target: runtime
      args:
        SERVICE: review
    environment:
      MODE: store
      MONGO_URI: "mongodb://mongodb-review:27017"
      LISTEN_ADDR: "0.0.0.0:8099"
      WASM_FILE: /app/review-store.wasm
      GC_EVERY: "${GC_EVERY:-1}"
    ports:
      - "8099:8099"
    depends_on:
      - mongodb-review
    restart: on-failure

  cache-review:
    build:
      context: .
      target: runtime
      args:
        SERVICE: cache
    environment:
      LISTEN_ADDR: "0.0.0.0:8112"
      WASM_FILE: /app/cache.wasm
      GC_EVERY: "${GC_EVERY:-1}"
    ports:
      - "8112:8112"
    restart: on-failure

  review:
    build:
      context: .
      target: runtime
      args:
        SERVICE: review
    environment:
      MODE: svc
      STORE_ADDR: "http://review-store:8099"
      CACHE_ADDR: "http://cache-review:8112"
      LISTEN_ADDR: "0.0.0.0:8098"
      WASM_FILE: /app/review.wasm
      GC_EVERY: "${GC_EVERY:-1}"
    ports:
      - "8098:8098"
    depends_on:
      - review-store
      - cache-review
    restart: on-failure

  mongodb-reservation:
    image: mongo:5.0
    volumes:
      - reservation-data:/data/db
      - ./data/reservation-numbers-seed.json:/seed/reservation-numbers-seed.json:ro
      - ./data/reservation-reservations-seed.json:/seed/reservation-reservations-seed.json:ro
      - ./data/init/reservation-init.sh:/docker-entrypoint-initdb.d/init.sh:ro

  reservation-store:
    build:
      context: .
      target: runtime
      args:
        SERVICE: reservation
    environment:
      MODE: store
      MONGO_URI: "mongodb://mongodb-reservation:27017"
      LISTEN_ADDR: "0.0.0.0:8101"
      WASM_FILE: /app/reservation-store.wasm
      GC_EVERY: "${GC_EVERY:-1}"
    ports:
      - "8101:8101"
    depends_on:
      - mongodb-reservation
    restart: on-failure

  cache-reserve:
    build:
      context: .
      target: runtime
      args:
        SERVICE: cache
    environment:
      LISTEN_ADDR: "0.0.0.0:8113"
      WASM_FILE: /app/cache.wasm
      GC_EVERY: "${GC_EVERY:-1}"
    ports:
      - "8113:8113"
    restart: on-failure

  reservation:
    build:
      context: .
      target: runtime
      args:
        SERVICE: reservation
    environment:
      MODE: svc
      STORE_ADDR: "http://reservation-store:8101"
      CACHE_ADDR: "http://cache-reserve:8113"
      LISTEN_ADDR: "0.0.0.0:8100"
      WASM_FILE: /app/reservation.wasm
      GC_EVERY: "${GC_EVERY:-1}"
    ports:
      - "8100:8100"
    depends_on:
      - reservation-store
      - cache-reserve
    restart: on-failure

  frontend:
    build:
      context: .
      target: runtime
      args:
        SERVICE: frontend
    environment:
      GC_EVERY:            "${GC_EVERY:-1}"
      LISTEN_ADDR:         "0.0.0.0:8080"
      SEARCH_ADDR:         "http://search:8097"
      PROFILE_ADDR:        "http://profile:8095"
      RECOMMENDATION_ADDR: "http://recommendation:8085"
      USER_ADDR:           "http://user:8091"
      REVIEW_ADDR:         "http://review:8098"
      ATTRACTIONS_ADDR:    "http://attractions:8087"
      RESERVATION_ADDR:    "http://reservation:8100"
    ports:
      - "8080:8080"
    depends_on:
      - search
      - profile
      - recommendation
      - user
      - review
      - attractions
      - reservation
    restart: on-failure

volumes:
  recommendation-data:
  attractions-data:
  geo-data:
  user-data:
  rate-data:
  profile-data:
  review-data:
  reservation-data:
