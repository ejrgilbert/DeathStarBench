# Config 2 (TCP): each wasm component runs in its own host process.
# Inter-component calls go over gRPC on the Docker bridge network.
#
# Prerequisite: run `make all` to build *.wasm files before bringing this stack up.

services:
  mongodb-recommendation:
    image: mongo:5.0
    volumes:
      - recommendation-data:/data/db

  recommendation-store:
    build:
      context: .
      target: runtime
      args:
        SERVICE: recommendation
    environment:
      MODE: store
      MONGO_URI: "mongodb://mongodb-recommendation:27017"
      LISTEN_ADDR: "0.0.0.0:8086"
      DATA_DIR: /data
      WASM_FILE: /app/recommendation-store.wasm
    ports:
      - "8086:8086"
    volumes:
      - ./data/recommendation-seed.json:/data/recommendation-seed.json:ro
    depends_on:
      - mongodb-recommendation
    restart: on-failure

  recommendation:
    build:
      context: .
      target: runtime
      args:
        SERVICE: recommendation
    environment:
      MODE: svc
      STORE_ADDR: "http://recommendation-store:8086"
      LISTEN_ADDR: "0.0.0.0:8085"
      WASM_FILE: /app/recommendation.wasm
    ports:
      - "8085:8085"
    depends_on:
      - recommendation-store
    restart: on-failure

  mongodb-attractions:
