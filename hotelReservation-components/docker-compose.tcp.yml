# Config 2 (TCP): each wasm component runs in its own host process.
# Inter-component calls go over gRPC on the Docker bridge network.
#
# Prerequisite: run `make all` to build *.wasm files before bringing this stack up.

services:
  mongodb-recommendation:
    image: mongo:5.0
    volumes:
      - recommendation-data:/data/db

  recommendation-store:
    build:
      context: .
      target: runtime
      args:
        SERVICE: recommendation
    environment:
      MODE: store
      MONGO_URI: "mongodb://mongodb-recommendation:27017"
      LISTEN_ADDR: "0.0.0.0:8086"
      DATA_DIR: /data
      WASM_FILE: /app/recommendation-store.wasm
    ports:
      - "8086:8086"
    volumes:
      - ./data/recommendation-seed.json:/data/recommendation-seed.json:ro
    depends_on:
      - mongodb-recommendation
    restart: on-failure

  recommendation:
    build:
      context: .
      target: runtime
      args:
        SERVICE: recommendation
    environment:
      MODE: svc
      STORE_ADDR: "http://recommendation-store:8086"
      LISTEN_ADDR: "0.0.0.0:8085"
      WASM_FILE: /app/recommendation.wasm
    ports:
      - "8085:8085"
    depends_on:
      - recommendation-store
    restart: on-failure

  mongodb-attractions:
    image: mongo:5.0
    volumes:
      - attractions-data:/data/db

  attractions-store:
    build:
      context: .
      target: runtime
      args:
        SERVICE: attractions
    environment:
      MODE: store
      MONGO_URI: "mongodb://mongodb-attractions:27017"
      LISTEN_ADDR: "0.0.0.0:8088"
      DATA_DIR: /data
      WASM_FILE: /app/attractions-store.wasm
    ports:
      - "8088:8088"
    volumes:
      - ./data/attractions-seed.json:/data/attractions-seed.json:ro
    depends_on:
      - mongodb-attractions
    restart: on-failure

  attractions:
    build:
      context: .
      target: runtime
      args:
        SERVICE: attractions
    environment:
      MODE: svc
      STORE_ADDR: "http://attractions-store:8088"
      LISTEN_ADDR: "0.0.0.0:8087"
      WASM_FILE: /app/attractions.wasm
    ports:
      - "8087:8087"
    depends_on:
      - attractions-store
    restart: on-failure

  mongodb-geo:
    image: mongo:5.0
    volumes:
      - geo-data:/data/db

  geo-store:
    build:
      context: .
      target: runtime
      args:
        SERVICE: geo
    environment:
      MODE: store
      MONGO_URI: "mongodb://mongodb-geo:27017"
      LISTEN_ADDR: "0.0.0.0:8090"
      DATA_DIR: /data
      WASM_FILE: /app/geo-store.wasm
    ports:
      - "8090:8090"
    volumes:
      - ./data/geo-seed.json:/data/geo-seed.json:ro
    depends_on:
      - mongodb-geo
    restart: on-failure

  geo:
    build:
      context: .
      target: runtime
      args:
        SERVICE: geo
    environment:
      MODE: svc
      STORE_ADDR: "http://geo-store:8090"
      LISTEN_ADDR: "0.0.0.0:8089"
      WASM_FILE: /app/geo.wasm
    ports:
      - "8089:8089"
    depends_on:
      - geo-store
    restart: on-failure

volumes:
  recommendation-data:
  attractions-data:
  geo-data:
