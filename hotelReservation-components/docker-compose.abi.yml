# ABI config: everything composed into frontend-all.wasm, single host process.
#
# Prerequisite: run `make frontend-all` to build frontend-all.wasm before bringing this up.

services:
  mongodb:
    image: mongo:5.0
    volumes:
      - hotel-data:/data/db
      - ./data:/seed:ro
      - ./data/init/hotel-init.sh:/docker-entrypoint-initdb.d/init.sh:ro

  frontend:
    build:
      context: .
      target: runtime
      args:
        SERVICE: frontend
    environment:
      MODE:                      abi
      WASM_FILE:                 /app/frontend-all.wasm
      MONGO_URI:                 "mongodb://mongodb:27017"
      MONGO_DB:                  hotel
      LISTEN_ADDR:               "0.0.0.0:8080"
      WASMTIME_BACKTRACE_DETAILS: "1"
    ports:
      - "8080:8080"
    depends_on:
      - mongodb
    restart: on-failure

volumes:
  hotel-data:
