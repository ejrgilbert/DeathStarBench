# Overlay on docker-compose.tcp.yml: eBPF auto-instrumentation via Grafana Beyla.
services:
  beyla:
    image: grafana/beyla:latest
    pid: "host"
    privileged: true
    environment:
      # Component svc-mode inbound ports (LISTEN_ADDR in docker-compose.tcp.yml).
      BEYLA_OPEN_PORT: "8085,8087,8089,8091,8093,8095,8097,8098,8100"
      BEYLA_CONFIG_PATH: /config.yaml
    volumes:
      - ../../ebpf/${EBPF_BUILTIN:?set EBPF_BUILTIN}.yaml:/config.yaml:ro
      - /sys/kernel/security:/sys/kernel/security:ro
    depends_on:
      - frontend
